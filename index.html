<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#302b70">
  <title>소셜몬 · 우리 동네를 부탁해!</title>
  <link rel="stylesheet" href="./style.css?v=20261111-notebook-art">
</head>
<body>
  <div id="app" class="app" data-screen="cover">
    <header class="topbar">
      <div class="top-identities"><span class="social-brand"><img src="./assets/socialmon-brand-mark.webp" alt="" aria-hidden="true"><span>에듀잇티 사회 퀴즈</span></span><span class="social-unit">3학년 1학기 · 1단원 11~21차시</span></div>
      <div id="progress" class="progress" aria-label="탐사 진행 단계"></div>
      <div class="top-controls">
        <button class="social-icon" id="fullscreen" type="button" aria-label="전체 화면" title="전체 화면" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg></button>
        <button class="social-icon" id="settingsToggle" type="button" aria-label="설정 열기" aria-haspopup="dialog" aria-controls="settingsDialog"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M21 5h6l1.2 5a16 16 0 0 1 3.8 1.6l4.4-2.6 4.2 4.2-2.6 4.4a16 16 0 0 1 1.6 3.8l5 1.2v6l-5 1.2a16 16 0 0 1-1.6 3.8l2.6 4.4-4.2 4.2-4.4-2.6a16 16 0 0 1-3.8 1.6L27 45h-6l-1.2-5a16 16 0 0 1-3.8-1.6L11.6 41 7.4 36.8l2.6-4.4a16 16 0 0 1-1.6-3.8l-5-1.2v-6l5-1.2a16 16 0 0 1 1.6-3.8L7.4 13l4.2-4.2 4.4 2.6a16 16 0 0 1 3.8-1.6L21 5Z"/><circle cx="24" cy="24" r="6"/></svg></button>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
    <dialog class="social-dialog" id="settingsDialog" aria-labelledby="settingsTitle"><h2 id="settingsTitle">설정</h2><button class="settings-row" id="motion" type="button" aria-pressed="false">움직임 줄이기</button><button class="settings-row" id="showHelp" type="button">방법 다시 보기</button><button class="settings-row" id="restartGame" type="button">처음부터</button><button class="settings-close" id="settingsClose" type="button">닫기</button></dialog>
    <dialog class="social-dialog" id="helpDialog" aria-labelledby="helpTitle"><h2 id="helpTitle">탐사 방법</h2><p>동네의 장소를 누르고 주민의 이야기를 들어요. 자료를 살펴본 다음 동네를 더 좋게 만들 방법을 골라 보세요.</p><button class="settings-close" id="helpClose" type="button">닫기</button></dialog>
  </div>
  <script type="module" src="./app.mjs?v=20261111-notebook-art"></script>

</body>
</html>
